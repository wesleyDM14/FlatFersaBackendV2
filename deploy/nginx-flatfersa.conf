# =================================================================
# BLOCOS DO SERVIDOR PARA: {{DOMINIO_BACKEND}} (FlatFersa API)
# =================================================================
# Troque {{DOMINIO_BACKEND}} pelo subdomínio real (ex: api.flatfersa.com.br)
# assim que o registro DNS tipo A estiver criado.
#
# Ordem de aplicação (ver deploy/README.md para o passo a passo completo):
#   1) Cole primeiro SÓ o bloco "listen 80" (sem o bloco 443) e suba o nginx.
#   2) Emita o certificado com o certbot (webroot).
#   3) Cole o bloco "listen 443 ssl" abaixo e recarregue o nginx de novo.

server {
    listen 80;
    server_name {{DOMINIO_BACKEND}};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name {{DOMINIO_BACKEND}};

    ssl_certificate /etc/letsencrypt/live/{{DOMINIO_BACKEND}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{DOMINIO_BACKEND}}/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://flatfersa-api:3333;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
